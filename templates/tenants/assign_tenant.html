{% extends "base.html" %}

{% block content %}
<div class="page-wrapper">
    <div class="card col-md-6 mx-auto">
        <h2 class="section-title mb-4">Assign Tenant to {{ property.title }}</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Select User</label>
                <select name="user_id" class="form-control" required>
                    <option value="">-- Choose a resident --</option>
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.get_full_name }} (@{{ user.username }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="+212...">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Lease Start</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Lease End</label>
                    <input type="date" name="end_date" class="form-control" required>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn-estate primary flex-grow-1">Confirm Assignment</button>
                <a href="{% url 'property_detail' property.id %}" class="btn-estate flex-grow-1 text-center">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
