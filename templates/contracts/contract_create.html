{% extends "base.html" %}

{% block title %}New Contract — Estāte{% endblock %}

{% block content %}
<style>
  .form-card{
    max-width:720px;
    margin:auto;
    background:var(--bg-card);
    border:0.5px solid var(--border-light);
    border-radius:var(--radius-lg);
    padding:24px;
  }

  .form-header{
    margin-bottom:20px;
  }

  .form-title{
    font-size:18px;
    font-weight:600;
    color:var(--text-primary);
  }

  .form-sub{
    font-size:12px;
    color:var(--text-secondary);
    margin-top:4px;
  }

  .form-group{
    margin-bottom:16px;
  }

  label{
    display:block;
    font-size:12px;
    color:var(--text-secondary);
    margin-bottom:6px;
  }

  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    border:0.5px solid var(--border-light);
    background:var(--bg-secondary);
    color:var(--text-primary);
    font-size:13px;
    outline:none;
  }

  input:focus, select:focus, textarea:focus{
    border-color:var(--blue-text);
    background:var(--bg-card);
  }

  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
  }

  .btn-cancel{
    background:transparent;
    border:0.5px solid var(--border-light);
    padding:8px 14px;
    border-radius:var(--radius-sm);
    font-size:12px;
    color:var(--text-secondary);
    text-decoration:none;
  }

  .btn-submit{
    background:var(--blue-text);
    color:white;
    padding:8px 14px;
    border:none;
    border-radius:var(--radius-sm);
    font-size:12px;
    cursor:pointer;
  }

  .btn-submit:hover{
    opacity:0.9;
  }

  .locked-box{
    padding:10px 12px;
    background:#f3f4f6;
    border-radius:var(--radius-sm);
    font-size:13px;
    color:#555;
    border:0.5px solid var(--border-light);
  }
</style>
<div class="form-card">

  <form method="POST">
    {% csrf_token %}

    <!-- Tenant (display only) -->
    <div class="form-group">
      <label>Tenant</label>
      <div class="locked-box">
        {{ tenant.user.username }}
      </div>
    </div>

    <!-- Property (display only) -->
    <div class="form-group">
      <label>Property</label>
      <div class="locked-box">
        {{ property.title }}
      </div>
    </div>

    <!-- Rent -->
    <div class="form-group">
      <label>Monthly Rent</label>
      {{ form.rent_amount }}
    </div>

    <!-- Dates -->
    <div class="form-row">
      <div class="form-group">
        <label>Start Date</label>
        {{ form.start_date }}
      </div>

      <div class="form-group">
        <label>End Date</label>
        {{ form.end_date }}
      </div>
    </div>

    <!-- Deposit -->
    <div class="form-group">
      <label>Deposit</label>
      {{ form.deposit }}
    </div>

    <!-- Notes -->
    <div class="form-group">
      <label>Notes</label>
      {{ form.notes }}
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a href="{% url 'contract_list' %}" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-submit">Create Contract</button>
    </div>

  </form>

</div>

{% endblock %}
